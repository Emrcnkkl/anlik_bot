<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantAI | Kısa Vadeli Momentum Radarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f4f6f9; --card: #ffffff; --text: #0f172a; --text-sec: #475569; --border: #e2e8f0; --primary: #0284c7; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; text-align: center; }
        header h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); }
        header p { color: var(--text-sec); font-size: 13px; margin-top: 0.2rem; }
        main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        
        .table-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .table-header { padding: 1rem; background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .table-header span { font-size: 12px; font-weight: 600; color: var(--text-sec); }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: #f8fafc; color: var(--text-sec); font-size: 11px; text-transform: uppercase; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:hover { background: #f1f5f9; }
        
        .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 11px; font-weight: 700; }
        .sig-al { background: #dcfce7; color: #16a34a; }
        .sig-sat { background: #fee2e2; color: #dc2626; }
        .sig-tut { background: #f1f5f9; color: #475569; }
        .ticker { font-weight: 700; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>QuantAI Saatlik Momentum Radarı</h1>
        <p>BİST30 Hızlı EMA & MACD Kesişim Sensörü</p>
    </header>

    <main>
        <div class="table-card">
            <div class="table-header">
                <span>🟢 Son Güncelleme: <strong id="update-time" class="mono">Yükleniyor...</strong></span>
                <span>Interval: 1H</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Hisse</th>
                        <th>Saatlik Sinyal</th>
                        <th>Anlık Fiyat</th>
                        <th>RSI Seviyesi</th>
                        <th>Sinyal Nedeni</th>
                    </tr>
                </thead>
                <tbody id="veri-govdesi">
                    <tr><td colspan="5" style="text-align:center;">Canlı veriler yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        async function verileriCek() {
            try {
                // signals.json dosyasını çekiyoruz
                const response = await fetch('signals.json');
                const data = await response.json();
                
                const tbody = document.getElementById('veri-govdesi');
                tbody.innerHTML = '';
                
                if(data.length > 0) {
                    document.getElementById('update-time').textContent = data[0].zaman;
                }

                data.forEach(item => {
                    let badgeClass = 'sig-tut';
                    if (item.sinyal === 'AL') badgeClass = 'sig-al';
                    if (item.sinyal === 'SAT') badgeClass = 'sig-sat';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="ticker mono">${item.hisse}</td>
                        <td><span class="badge ${badgeClass} mono">${item.sinyal}</span></td>
                        <td class="mono">${item.fiyat.toFixed(2)} ₺</td>
                        <td class="mono ${item.rsi > 70 ? 'sig-sat' : (item.rsi < 30 ? 'sig-al' : '')}">${item.rsi}</td>
                        <td style="color:var(--text-sec); font-size:12px;">${item.sebep}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('veri-govdesi').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Veriler yüklenemedi. Botun yeni veriyi atması bekleniyor.</td></tr>';
            }
        }

        // Sayfa açıldığında veriyi çek
        verileriCek();
    </script>
</body>
</html>
