name: Günlük BIST100 Kantitatif Analiz Botu

on:
  schedule:
    # 16:00 UTC = 19:00 Türkiye saati (UTC+3). Kapanış fiyatlarının Yahoo'da netleşmesi için
    # seans bitişinden bir süre sonraya bırakıldı. Yalnızca hafta içi (1-5) çalışır.
    - cron: '0 16 * * 1-5'
  workflow_dispatch: # GitHub üzerinden manuel tetikleme butonu

# Aynı anda iki çalışma birbirinin history.json dosyasını ezmesin
concurrency:
  group: otonom-bot
  cancel-in-progress: false

jobs:
  analiz-yap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # signals.json ve history.json dosyalarını depoya yazabilmek için

    steps:
    - name: 📥 Depoyu Klonla
      uses: actions/checkout@v4

    - name: 🐍 Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy

    - name: ⚙️ Botu Çalıştır
      run: python quant_bot.py

    - name: 📤 Sonuçları Depoya Yükle (Commit)
      run: |
        git config --global user.name "quant-bot[bot]"
        git config --global user.email "quant-bot[bot]@users.noreply.github.com"
        git add signals.json history.json
        git commit -m "🤖 Otonom Güncelleme: Günlük BIST100 Sinyalleri" || echo "Değişiklik yok, commit atlanıyor."
        git pull --rebase
        git push
